<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PIXLE.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient glow orbs behind the glass panels -->
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="app" id="app">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar glass" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="logo">P</span>
          <span class="brand-name">PIXLE.AI</span>
        </div>
        <button class="icon-btn" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChatBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">New chat</span>
      </button>

      <p class="section-title label">Recent chats</p>
      <nav class="history" id="historyList" aria-label="Chat history"></nav>

      <div class="profile">
        <div class="avatar">AK</div>
        <div class="profile-info label">
          <strong>Aarav Kulkarni</strong>
          <span>Free plan</span>
        </div>
        <button class="icon-btn label" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </aside>

    <!-- ===== MAIN CHAT ===== -->
    <main class="chat">
      <header class="chat-header glass">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="title-wrap">
          <h1>PIXLE.AI</h1>
          <span class="status" id="status"><i class="dot"></i><span id="statusText">Online</span></span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="clearBtn" aria-label="Clear this chat" title="Clear this chat">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
          <button class="icon-btn" aria-label="Share" title="Share">
            <svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v13M7 8l5-5 5 5"/></svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <!-- Input bar -->
      <footer class="composer-wrap">
        <div class="composer glass">
          <textarea id="input" rows="1" placeholder="Message PIXLE.AI…" aria-label="Message"></textarea>
          <button class="send" id="sendBtn" aria-label="Send message" title="Send">
            <svg viewBox="0 0 24 24"><path d="M5 12l14-7-5 14-2-6-7-1z"/></svg>
          </button>
        </div>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
