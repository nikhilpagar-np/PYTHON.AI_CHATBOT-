 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="starfam.ai — explore the universe of ideas." />
  <meta name="theme-color" content="#030712" />
  <title>starfam.ai</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Universe background: photo (images/universe-bg.jpg) + animated 3D star depth (canvas) -->
  <div class="universe" aria-hidden="true"><canvas id="starfield"></canvas></div>

  <div class="app" id="app">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar glass" id="sidebar" aria-label="Sidebar">
      <div class="sidebar-top">
        <a class="brand" href="./" aria-label="starfam.ai home">
          <img class="brand-logo" src="images/logo.png" alt="" />
          <span class="brand-name">starfam.ai</span>
        </a>
        <button class="icon-btn" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChatBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">New chat</span>
      </button>

      <p class="section-title label">Recent chats</p>
      <nav class="history" id="historyList" aria-label="Chat history"></nav>
    </aside>

    <!-- Dark overlay behind the sidebar on mobile -->
    <div class="backdrop" id="backdrop"></div>

    <!-- ===== MAIN CHAT ===== -->
    <main class="chat">
      <!-- Navbar -->
      <header class="chat-header glass">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="title-wrap">
          <img class="nav-logo" src="images/logo.png" alt="" />
          <h1>starfam.ai</h1>
          <span class="status" id="status"><i class="dot"></i><span id="statusText">Online</span></span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="copyChatBtn" aria-label="Copy conversation" title="Copy conversation">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          </button>
          <button class="icon-btn" id="clearBtn" aria-label="Clear this chat" title="Clear this chat">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <!-- Prompt input -->
      <footer class="composer-wrap">
        <div class="composer glass">
          <textarea id="input" rows="1" placeholder="Message starfam.ai…" aria-label="Message"></textarea>
          <button class="send" id="sendBtn" aria-label="Send message" title="Send">
            <svg viewBox="0 0 24 24"><path d="M5 12l14-7-5 14-2-6-7-1z"/></svg>
          </button>
        </div>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </footer>
    </main>
  </div>

  <!-- Small message that confirms actions such as "Copied" -->
  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
